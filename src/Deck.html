<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GameShelf Deck</title>
<style>
/* GameShelf Deck – Oberfläche 1:1 aus dem abgenommenen Entwurf (Version 7). */
:root { --ui: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; --display: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #0E0F12; font-family: var(--ui); font-size: 14px; line-height: 1.45; -webkit-user-select: none; user-select: none; }
.screen { position: absolute; left: 0; top: 0; overflow: hidden; }
kbd { font-family: var(--ui); font-size: 12px; padding: 1px 6px; border: 1px solid; border-bottom-width: 2px; border-radius: 5px; white-space: nowrap; }
img { -webkit-user-drag: none; }
/* ================= Deck – GameShelf-Palette (aus GameShelf.ps1: Get-Palette) ================= */
.deckroot { --bg: #1F1F23; --surface: #2A2A2F; --ctrl: #34343B; --hover: #404049; --border: #4A4A54; --text: #F2F2F4; --sub: #A3A3AD;
  --accent: #3B82F6; --onaccent: #FFFFFF; --flash: #7FB2FF; --good: #4ADE80; --warnc: #FBBF24; --crit: #F87171;
  font-family: var(--ui); color: var(--text); }
.deckroot.light { --bg: #F3F3F5; --surface: #FFFFFF; --ctrl: #FFFFFF; --hover: #E8E8EC; --border: #CFCFD6; --text: #1B1B1F; --sub: #5E5E68;
  --good: #15803D; --warnc: #B45309; --crit: #B91C1C; --flash: #2563EB; }
.area { position: absolute; overflow: hidden; }
.deck { background: var(--bg); }
.clock { font-family: var(--display); font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.clock small { font-family: var(--ui); font-size: 13px; color: var(--sub); font-weight: 400; margin-left: 8px; }
.btn { font: inherit; font-size: 15px; font-weight: 600; border: 0; border-radius: 8px; padding: 10px 20px; background: var(--accent); color: var(--onaccent); cursor: pointer; min-height: 44px; }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.cover { position: absolute; overflow: hidden; border-radius: 6px; cursor: pointer; }
.cover .art { position: absolute; inset: 0; }
.cover:focus-visible, .reel:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.reel { position: absolute; }
.reel .slot { position: absolute; inset: 0; overflow: hidden; border-radius: 6px; box-shadow: 0 10px 28px rgba(0,0,0,.5); }
.reel .slot .art { position: absolute; inset: 0; }
.info .name { font-family: var(--display); font-weight: 600; color: var(--text); line-height: 1.15; text-wrap: balance; }
.info .meta { color: var(--sub); font-size: 14px; display: grid; gap: 2px; }
.info .meta b { color: var(--text); font-weight: 500; }
.label { font-size: 12px; color: var(--sub); text-transform: uppercase; letter-spacing: 0.07em; }
.pos { font-size: 12px; color: var(--sub); font-variant-numeric: tabular-nums; letter-spacing: 0.08em; }

.hud .lab { font-size: 13px; color: var(--sub); letter-spacing: 0.02em; }
.hud .num, .tile .num { font-family: var(--display); font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1; color: var(--text); }
.unit { font-size: 0.42em; color: var(--sub); font-weight: 500; margin-left: 4px; }
.tile { position: absolute; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; display: flex; flex-direction: column; justify-content: space-between; }
.tile .lab { font-size: 13px; color: var(--sub); }
.nofps { color: var(--sub); font-size: 14px; line-height: 1.4; }


/* ---------- Ansicht-Menü im Deck ---------- */
.menu { position: absolute; left: 16px; top: 140px; z-index: 6; width: 360px; max-width: calc(100% - 32px); background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px; display: grid; gap: 10px; box-shadow: 0 18px 40px rgba(0,0,0,.45); }
.menu .row { display: grid; gap: 5px; }
.menu .rh { display: flex; justify-content: space-between; font-size: 14px; color: var(--sub); }
.menu .rh kbd { font-size: 14px; color: var(--sub); border-color: var(--border); }
.menu .opts { display: flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.menu .opts button { flex: 1; font: inherit; font-size: 14px; padding: 7px 6px; border: 0; border-right: 1px solid var(--border); background: transparent; color: var(--text); cursor: pointer; }
.menu .opts button:last-child { border-right: 0; }
.menu .opts button.on { background: var(--accent); color: var(--onaccent); }
.menu .opts button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.menu .opts button:disabled { opacity: .35; cursor: not-allowed; }

/* ---------- Startanimation „Einrasten“ (wie GameShelf launchAnim=on) ---------- */
.flashov { position: absolute; inset: 0; background: var(--flash); opacity: 0; pointer-events: none; border-radius: inherit; }
.edgelight { position: absolute; left: 0; right: 0; height: 5px; pointer-events: none; opacity: 0; z-index: 4; }

/* ================= Glas-Sprache (alle Stile): schwebende Kopfleiste, Glas-Karten, Pillen ================= */
.deckroot { --glass: rgba(255,255,255,.06); --glass-brd: rgba(255,255,255,.06); --glass-hi: rgba(255,255,255,.07); --sheen: rgba(255,255,255,.09); --sheen2: rgba(255,255,255,.03); --blur: 28px; --r: 20px; --rc: 16px; }
.deckroot .panel { position: absolute; border-radius: 24px; pointer-events: none; }
.deckroot .tile, .deckroot .menu, .deckroot .panel {
  background-color: var(--glass); background-image: linear-gradient(135deg, var(--sheen) 0%, transparent 42%, transparent 70%, var(--sheen2) 100%); border: 1px solid var(--glass-brd);
  -webkit-backdrop-filter: blur(var(--blur)) saturate(1.4); backdrop-filter: blur(var(--blur)) saturate(1.4);
  box-shadow: inset 0 1px 0 var(--glass-hi), 0 10px 30px rgba(0,0,0,.22); }
.deckroot .tile { border-radius: var(--r); padding: 14px 16px; }
.deckroot .menu { border-radius: 20px; padding: 14px; }
.deckroot .btn { border-radius: 999px; padding: 11px 26px 11px 22px; display: inline-flex; align-items: center; gap: 10px; }
.deckroot .btn[data-act="launch"]::before { content: ""; width: 10px; height: 12px; background: currentColor; clip-path: polygon(0 0, 100% 50%, 0 100%); }
.deckroot .cover, .deckroot .reel .slot { border-radius: var(--rc); }
.deckroot .cover::after, .deckroot .reel .slot::after { content: ""; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 0 0 1px rgba(255,255,255,.14), inset 0 1px 0 rgba(255,255,255,.22); pointer-events: none; }
.deckroot .tile .lab, .deckroot .hud .lab, .deckroot .label { font-size: 14px; letter-spacing: .02em; }
.deckroot .num { letter-spacing: -.02em; }
.deckroot .info .name { letter-spacing: -.02em; }
.deckroot .menu .opts { border: 0; background: rgba(0,0,0,.22); border-radius: 12px; padding: 3px; gap: 2px; }
.deckroot .menu .opts button { border: 0; border-radius: 9px; }
.deckroot .menu .opts button.on { background: rgba(255,255,255,.92); color: #121316; }

/* ---------- Kopfbereich: links Einstellungen (Glas), rechts große Glas-Uhr über dem Cover ---------- */

/* ---------- Stil: Glas – Mica-Grund in der Windows-Akzentfarbe, Milchglas-Karten ---------- */
.s-glas .deck { background: #0E0F12; }
.s-glas .btn { background: #fff; color: #111216; }
.s-glas.light { --glass: rgba(255,255,255,.5); --glass-brd: rgba(255,255,255,.9); --glass-hi: rgba(255,255,255,.95); --sheen: rgba(255,255,255,.6); --sheen2: rgba(255,255,255,.2); }
.s-glas.light .deck { background: #E6E9EF; }
.s-glas.light .tile, .s-glas.light .menu, .s-glas.light .panel { box-shadow: inset 0 1px 0 var(--glass-hi), 0 10px 30px rgba(30,40,60,.10); }
.s-glas.light .btn { background: #15161A; color: #fff; }
.s-glas.light .menu .opts { background: rgba(0,0,0,.06); }
.s-glas.light .menu .opts button.on { background: #15161A; color: #fff; }

/* ---------- Stil: OLED-Nacht – reines Schwarz, Glas nur als Hauch, große leichte Ziffern ---------- */
.s-oled { --glass: rgba(255,255,255,.035); --glass-brd: rgba(255,255,255,.09); --glass-hi: rgba(255,255,255,.08); --sheen: rgba(255,255,255,.05); --sheen2: rgba(255,255,255,.015); --sub: #8C8C96; --ctrl: #121216; --r: 16px; --rc: 10px; }
.s-oled .deck { background: #000; }
.s-oled .tile .lab, .s-oled .hud .lab, .s-oled .label { text-transform: uppercase; letter-spacing: .12em; font-size: 11px; }
.s-oled .num { font-weight: 300 !important; }
.s-oled .btn { background: transparent; color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); font-weight: 500; }
.s-oled .info .name { font-weight: 300; }

/* ---------- Stil: Cockpit – Instrumente mit Bogenanzeigen, Glas mit blauem Schimmer ---------- */
.s-cockpit { --glass: rgba(40,60,95,.28); --glass-brd: rgba(127,178,255,.2); --glass-hi: rgba(160,200,255,.16); --sheen: rgba(160,200,255,.10); --sheen2: rgba(127,178,255,.04); --ctrl: rgba(127,178,255,.12); --sub: #8D9AB3; --rc: 12px; }
.s-cockpit .deck { background: radial-gradient(120% 90% at 50% 0%, #182030 0%, #0C0F15 60%), #0C0F15; }
.s-cockpit .tile .lab, .s-cockpit .hud .lab { text-transform: uppercase; letter-spacing: .1em; font-size: 11px; }
.s-cockpit .btn { box-shadow: inset 0 1px 0 rgba(255,255,255,.25), 0 6px 22px color-mix(in srgb, var(--accent) 45%, transparent); }
.s-cockpit .pos { font-family: Consolas, "Cascadia Mono", monospace; color: var(--accent); }
@keyframes pulse { 50% { box-shadow: 0 0 0 2px var(--accent), 0 0 22px 2px color-mix(in srgb, var(--accent) 50%, transparent); } }

/* Nutzer, Spiel-Pille, Touch */
.deckroot .avatar { width: 34px; height: 34px; border-radius: 50%; flex: none; background: center / cover no-repeat; box-shadow: inset 0 0 0 1px rgba(255,255,255,.25), 0 2px 8px rgba(0,0,0,.3); }
#screen { touch-action: none; }
/* ---------- DeckOS ---------- */
.osmode .menu { top: 16px !important; bottom: 100px !important; }
/* Controller-Markierung */
.deckroot .ospagewrap { position: absolute; left: 0; top: 0; width: 100%; height: 100%; will-change: transform, opacity; }
.deckroot .snapglow { position: absolute; inset: 0; border-radius: inherit; box-shadow: 0 0 42px 6px var(--flash), inset 0 0 28px 4px var(--flash); border-radius: 10px; opacity: 0; pointer-events: none; will-change: opacity; }
.deckroot .libscroll, .deckroot .hscroll, .deckroot .vscroll { will-change: scroll-position; overscroll-behavior: contain; }
.deckroot .splash .spimg { will-change: transform; }
.deckroot .osbat { display: flex; align-items: center; gap: 6px; padding: 0 12px; height: 44px; border-radius: 999px; background: rgba(255,255,255,.05); border: 1px solid var(--glass-brd); font-size: 14px; white-space: nowrap; flex: none; }
.deckroot .osbat b { font-weight: 600; font-variant-numeric: tabular-nums; }
.deckroot .osbatb { width: 16px; height: 8px; border: 1.5px solid currentColor; border-radius: 3px; padding: 1px; position: relative; display: inline-flex; box-sizing: content-box; }
.deckroot .osbatb::after { content: ""; position: absolute; right: -4px; top: 2px; width: 2px; height: 4px; background: currentColor; border-radius: 0 1px 1px 0; }
.deckroot .osbatb i { display: block; height: 100%; border-radius: 1px; }
.volosd { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; pointer-events: none; opacity: 0; transition: opacity .16s ease;
  background: radial-gradient(ellipse at 50% 55%, rgba(10,11,15,.78), rgba(6,7,10,.92)); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
  color: #F2F2F3; font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; }
.volosd.on { opacity: 1; }
.volosd .vbox { display: flex; flex-direction: column; align-items: center; gap: 3.2vh; width: min(62vw, 1500px); transform: scale(.97); transition: transform .2s cubic-bezier(.2,.8,.2,1); }
.volosd.on .vbox { transform: none; }
.volosd .vrow { display: flex; align-items: center; gap: 3vh; }
.volosd .vi { color: var(--a); display: grid; place-items: center; width: 15vh; height: 15vh; border-radius: 50%; background: color-mix(in srgb, var(--a) 14%, transparent); border: 1px solid color-mix(in srgb, var(--a) 40%, transparent); }
.volosd .vi svg { width: 8vh; height: 8vh; }
.volosd b { font-size: 26vh; line-height: .9; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.volosd b small { font-size: .38em; font-weight: 500; color: rgba(242,242,243,.55); margin-left: .12em; }
.volosd .vt { width: 100%; height: 1.6vh; min-height: 8px; border-radius: 99px; background: rgba(255,255,255,.1); overflow: hidden; }
.volosd .vt i { display: block; height: 100%; border-radius: 99px; background: var(--a); box-shadow: 0 0 2.4vh color-mix(in srgb, var(--a) 60%, transparent); transition: width .08s linear; }
.volosd .vl { font-size: 2.6vh; letter-spacing: .18em; text-transform: uppercase; color: rgba(242,242,243,.5); }
.deckroot .oswa { display: flex; align-items: center; gap: 8px; padding: 0 16px 0 12px; height: 60px; border-radius: 999px; background: rgba(37,211,102,.14); border: 1px solid rgba(37,211,102,.45); color: #3BD776; font: inherit; font-size: 15px; white-space: nowrap; flex: none; cursor: pointer; }
.deckroot .oswa b { min-width: 22px; height: 22px; padding: 0 6px; box-sizing: border-box; border-radius: 11px; background: #25D366; color: #06210F; font-size: 14px; font-weight: 700; display: grid; place-items: center; }
.deckroot .oswa.ping { animation: waping 1.2s ease-out 2; }
@keyframes waping { 0% { box-shadow: 0 0 0 0 rgba(37,211,102,.55); } 100% { box-shadow: 0 0 0 16px rgba(37,211,102,0); } }
.deckroot .ospagewrap .lab, .s-oled .ospagewrap .lab, .s-cockpit .ospagewrap .lab { font-family: var(--display); font-size: 17px; line-height: 20px; font-weight: 600; letter-spacing: .01em; text-transform: none; color: var(--text); display: flex; align-items: center; gap: 9px; white-space: nowrap; }
.deckroot .hdot { width: 10px; height: 10px; border-radius: 50%; background: var(--c); flex: none; box-shadow: 0 0 10px var(--c); }
.deckroot .hev { display: flex; align-items: center; gap: 14px; padding: 10px 14px; border-radius: 14px; background: rgba(255,255,255,.04); flex: none; }
.deckroot .hev.live { background: color-mix(in srgb, var(--c) 14%, transparent); }
.deckroot .hmonth { flex: 1 1 0; display: grid; grid-template-columns: repeat(7, minmax(0,1fr)); grid-auto-rows: minmax(0,1fr); gap: 4px; text-align: center; align-items: center; }
.deckroot .hmonth i { font-style: normal; font-size: 14px; color: var(--sub); }
.deckroot .hmonth span { position: relative; font-size: 15px; font-variant-numeric: tabular-nums; height: 100%; display: grid; place-items: center; border-radius: 10px; }
.deckroot .hmonth em { position: absolute; bottom: 3px; left: 50%; width: 5px; height: 5px; margin-left: -2.5px; border-radius: 50%; }
.deckroot .calin { width: min(100%, 820px); box-sizing: border-box; resize: vertical; min-height: 70px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--glass-brd, rgba(255,255,255,.14)); background: rgba(255,255,255,.05); color: var(--text); font: 13px/1.4 Consolas, "Cascadia Mono", monospace; }
.deckroot .calrow { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 12px; background: rgba(255,255,255,.04); margin-bottom: 8px; max-width: 820px; box-sizing: border-box; width: 100%; color: var(--text); font: inherit; border: 0; }
.deckroot .calrow b { display: block; font-size: 15px; } .deckroot .calrow span:not(.hdot) { display: block; font-size: 14px; color: var(--sub); }
.deckroot .calrow.add { background: none; padding: 0; } .deckroot .calrow.add .calin { flex: 1 1 0; min-height: 0; height: 42px; resize: none; }
.deckroot .calrow.pick { cursor: pointer; } .deckroot .calrow.pick:hover { background: rgba(255,255,255,.08); }
.deckroot .dockminiwrap { flex: 1 1 0; min-width: 0; display: flex; justify-content: center; padding: 0 12px; }
.deckroot .hmart { width: 44px; height: 44px; flex: none; border-radius: 50%; background: rgba(255,255,255,.08) center/cover; display: grid; place-items: center; color: var(--sub); }
.deckroot .hmtx { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; } .deckroot .hmtx b { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .deckroot .hmtx span { font-size: 14px; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@keyframes hpulse { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }
.deckroot .hdr { display: block; animation: hroll .6s cubic-bezier(.3,.85,.25,1) forwards; }
.deckroot .hdr b:first-child { animation: hfade .6s ease forwards; }
@keyframes hroll { from { transform: translateY(0); } to { transform: translateY(-1em); } }
@keyframes hfade { to { opacity: 0; } }
.volosd.fsok b { font-size: 16vh; letter-spacing: -.015em; }
.deckroot .dockminiwrap { flex: 1 1 0; min-width: 0; display: flex; justify-content: center; padding: 0 12px; }
.deckroot .island { display: inline-flex; align-items: center; height: 52px; max-width: 100%; min-width: 0; border-radius: 999px; background: rgba(255,255,255,.05); border: 1px solid var(--glass-brd); overflow: hidden; box-sizing: border-box; }
.deckroot .island.empty { display: none; }
.deckroot .island.ev { height: 60px; }
.deckroot .island .iin { display: flex; align-items: center; gap: 10px; padding: 0 8px; min-width: 0; white-space: nowrap; }
.deckroot .island .iin.idle { padding: 0 18px; color: var(--sub); gap: 8px; } .deckroot .island .iin.idle b { color: var(--text); font-size: 15px; font-variant-numeric: tabular-nums; }
.deckroot .island .hmart.sm { width: 36px; height: 36px; }
.deckroot .island .hmtx { max-width: 300px; } .deckroot .island.ev .hmtx { max-width: 420px; padding-right: 10px; }
.deckroot .island.ev .hmtx b { font-size: 16px; } .deckroot .island.ev .hmtx span { font-size: 14px; }
.deckroot .island .iic { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; background: color-mix(in srgb, var(--c) 18%, transparent); color: var(--c); flex: none; }
.deckroot .island .ibadge { font-style: normal; min-width: 28px; height: 28px; border-radius: 14px; background: var(--c); color: #06210F; font-weight: 700; font-size: 14px; display: grid; place-items: center; margin-right: 10px; padding: 0 8px; box-sizing: border-box; }
.deckroot .island .osrb.sm { width: 36px; height: 36px; flex: none; }
.deckroot .island .iwa { display: inline-flex; align-items: center; gap: 5px; height: 36px; padding: 0 10px; border-radius: 18px; border: 0; background: rgba(37,211,102,.16); color: #3BD776; font: inherit; font-weight: 700; cursor: pointer; flex: none; }
.deckroot .ieq { display: inline-flex; align-items: flex-end; gap: 2px; height: 16px; flex: none; } .deckroot .ieq i { width: 3px; height: 30%; border-radius: 2px; background: var(--accent); }
.deckroot .ieq.on { filter: drop-shadow(0 0 3px color-mix(in srgb, var(--accent) 80%, transparent)); }
.deckroot .ieq.on i { animation: ieq1 .93s ease-in-out infinite alternate; } .deckroot .ieq.on i:nth-child(2) { animation: ieq2 1.17s ease-in-out infinite alternate; animation-delay: -.4s; } .deckroot .ieq.on i:nth-child(3) { animation: ieq3 .79s ease-in-out infinite alternate; animation-delay: -.25s; }
@keyframes ieq1 { 0% { height: 22%; } 30% { height: 85%; } 55% { height: 45%; } 80% { height: 100%; } 100% { height: 35%; } }
@keyframes ieq2 { 0% { height: 60%; } 25% { height: 28%; } 50% { height: 100%; } 75% { height: 50%; } 100% { height: 78%; } }
@keyframes ieq3 { 0% { height: 40%; } 35% { height: 100%; } 60% { height: 30%; } 85% { height: 70%; } 100% { height: 20%; } }
.deckroot .ossw { position: relative; overflow: visible; }
.deckroot .ossw .spark { position: absolute; width: 4px; height: 4px; margin: -2px 0 0 -2px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 6px var(--accent); pointer-events: none; }
@keyframes ieq { 0%, 100% { height: 25%; } 50% { height: 100%; } }
.osmode .menu.sheet { top: 34px !important; bottom: 0 !important; left: 5% !important; right: 5% !important; border-radius: 28px 28px 0 0 !important; border-bottom: 0; box-shadow: 0 -20px 60px rgba(0,0,0,.6); padding-top: 26px; z-index: 9; }
.deckroot .menu.sheet .mgrab { position: absolute; left: 0; right: 0; top: 0; height: 26px; display: grid; place-items: center; cursor: grab; z-index: 2; }
.deckroot .menu.sheet .mgrab i { width: 54px; height: 5px; border-radius: 3px; background: rgba(255,255,255,.28); }
.deckroot .ospagewrap.recede, .osmode .menu.sheet ~ .osdock { }
.deckroot .osdock.recede { transform: scale(.955) translateY(-8px); filter: brightness(.5) blur(2px); transform-origin: 50% 0; }
.deckroot .ospagewrap.recede { transform: scale(.955) translateY(-8px); filter: brightness(.5) blur(2px); transform-origin: 50% 45%; }
.deckroot .hana { margin: 4px 0 2px; filter: drop-shadow(0 10px 24px rgba(0,0,0,.45)); }
.deckroot .hcard { position: absolute; left: 0; right: 0; top: 0; height: calc(100% - 64px); box-sizing: border-box; padding: 22px 26px; border-radius: 22px; overflow: hidden;
  background-color: var(--glass); background-image: linear-gradient(160deg, color-mix(in srgb, var(--c) 14%, transparent) 0%, transparent 55%, var(--sheen2, transparent) 100%);
  border: 1px solid var(--glass-brd); -webkit-backdrop-filter: blur(var(--blur, 18px)) saturate(1.4); backdrop-filter: blur(var(--blur, 18px)) saturate(1.4);
  box-shadow: inset 0 1px 0 var(--glass-hi, rgba(255,255,255,.08)), 0 10px 30px rgba(0,0,0,.22);

/* --- 1 · Lichtbühne: ein durchgehendes, langsam wanderndes Licht hinter allen Flächen --- */
.rv-amb { position: absolute; inset: -80px -340px; z-index: 0; pointer-events: none; overflow: hidden; opacity: var(--rv-amb, .62);
  transform: translateX(calc(var(--rv-x, 0) * -46px)); transition: transform 1.1s cubic-bezier(.2,.8,.2,1), opacity .8s ease; }

.rv-amb i:nth-child(2) { left: 22%; top: -40%; width: 64%; height: 210%; background: radial-gradient(closest-side, var(--a2) 0%, color-mix(in srgb, var(--a2) 50%, transparent) 40%, transparent 100%); animation: rv-d2 46s ease-in-out infinite alternate; opacity: .85; }
.rv-amb i:nth-child(3) { right: -12%; top: -80%; width: 68%; height: 220%; background: radial-gradient(closest-side, var(--a3) 0%, color-mix(in srgb, var(--a3) 55%, transparent) 38%, transparent 100%); animation: rv-d3 52s ease-in-out infinite alternate; }
body.game-on .rv-amb i { animation-play-state: paused; }   /* im Spiel steht die Bühne still, wie alle anderen Animationen */
.rv-amb::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(6,7,11,.25), rgba(6,7,11,.0) 30%, rgba(6,7,11,.55) 100%); }
